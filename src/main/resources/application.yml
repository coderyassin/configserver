server:
  port: 8071

spring:
  application:
    name: configserver
  profiles:
    active: git
  cloud:
    config:
      server:
        git:
          uri: "https://github.com/coderyassin/eazybytes-config.git"
          default-label: main
          timeout: 5
          clone-on-start: true
          force-pull: true
  rabbitmq:
    host: "192.168.145.108"
    port: 5672
    username: "guest"
    password: "guest"

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      probes:
        enabled: true
    env:
      show-values: always
  info:
    env:
      enabled: true
  health:
    readinessState:
      enabled: true
    livenessState:
      enabled: true

encrypt:
  key: "45D81EC1EF61DF9AD8D3E5BB397F9"